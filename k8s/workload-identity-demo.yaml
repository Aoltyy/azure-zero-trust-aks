apiVersion: v1
kind: ServiceAccount
metadata:
  name: workload-identity-sa
  namespace: default
  annotations:
    azure.workload.identity/client-id: "${WORKLOAD_IDENTITY_CLIENT_ID}" # Replace with terraform output: workload_identity_client_id
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zero-trust-secret-consumer
  namespace: default
  labels:
    app: zero-trust-secret-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zero-trust-secret-consumer
  template:
    metadata:
      labels:
        app: zero-trust-secret-consumer
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: workload-identity-sa
      containers:
        - name: app
          image: mcr.microsoft.com/azure-cli:latest
          command:
            - "/bin/sh"
            - "-c"
            - "echo 'Mounted Secret Content:'; cat /mnt/secrets-store/demo-app-secret; echo ''; sleep 3600"
          volumeMounts:
            - name: secrets-store-inline
              mountPath: "/mnt/secrets-store"
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
      volumes:
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "azure-kv-workload-identity"
