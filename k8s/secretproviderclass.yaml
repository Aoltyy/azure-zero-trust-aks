apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: azure-kv-workload-identity
  namespace: default
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "${WORKLOAD_IDENTITY_CLIENT_ID}" # Replace with terraform output: workload_identity_client_id
    keyvaultName: "${KEY_VAULT_NAME}"         # Replace with terraform output: key_vault_name
    cloudName: ""                             # Defaults to AzurePublicCloud
    objects: |
      array:
        - |
          objectName: demo-app-secret
          objectType: secret
          objectVersion: ""
    tenantId: "${AZURE_TENANT_ID}"             # Replace with terraform output: workload_identity_tenant_id
